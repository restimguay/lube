# Builds and tests Lube on Linux, macOS and Windows; packages a binary for
# each. Pushing a tag like v0.1.0 also publishes them as a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -O2 -Werror
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -k
      - name: Test
        run: make test
      - name: A real window (X11, on a screen of Xvfb's), with fullscreen, the cursor and controllers
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a ./lube tests/cli/gfx_real_window.lube
      # The sanitizers' runtimes need a smaller address randomization than
      # this kernel's default.
      - name: Allow the sanitizers' memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer (and the leak check)
        run: make check
      - name: Test with ThreadSanitizer
        run: make tsan
      - name: Keep the output of failing tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-${{ runner.os }}-${{ matrix.cc }}
          path: build/failed/
          if-no-files-found: ignore
      - name: Package (a static binary, for any distribution)
        if: matrix.cc == 'gcc'
        run: |
          make clean
          # its plugins inside it (a static program cannot load libraries: no ALSA, so no sound; no X11, so
          # no windows: it draws images, and shows windows nowhere with LUBE_GFX=none)
          CFLAGS="-O2 -DLUBE_SILENT -DLUBE_NO_DISPLAY" LDFLAGS="-static -s" make STATIC_PLUGINS=1
          ./lube -e 'print("lube runs:", 1 + 2)'
          ./lube -e 'import net; print("with its plugins:", net.udp_open())'
          tar czf lube-linux-x86_64.tar.gz lube README.md
      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc'
        with:
          name: lube-linux-x86_64
          path: lube-linux-x86_64.tar.gz

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CFLAGS: -O2 -Werror
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -k
      - name: Test
        run: make test
      - name: A real window (Cocoa), with fullscreen, the cursor and controllers
        run: ./lube tests/cli/gfx_real_window.lube
      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer (and the leak check)
        run: make check
      - name: Coverage (every line and function must run)
        run: make coverage
      - name: Keep the output of failing tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-${{ runner.os }}
          path: build/failed/
          if-no-files-found: ignore
      - name: Package (a universal binary, for Apple silicon and Intel)
        run: |
          make clean
          CFLAGS="-O2 -arch arm64 -arch x86_64" LDFLAGS="-arch arm64 -arch x86_64" make
          strip lube
          strip -x plugins/*.dylib
          lipo -info lube plugins/*.dylib
          ./lube -e 'print("lube runs:", 1 + 2)'
          ./lube -e 'import net; print("with its plugins:", net.udp_open())'
          tar czf lube-macos-universal.tar.gz lube plugins README.md
      - uses: actions/upload-artifact@v4
        with:
          name: lube-macos-universal
          path: lube-macos-universal.tar.gz

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    env:
      CFLAGS: -O2 -Werror
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: make diffutils mingw-w64-ucrt-x86_64-gcc zip
      - name: Build
        run: make -k
      - name: Test
        run: make test
      - name: A real window (Win32), with fullscreen, the cursor and controllers (XInput)
        run: ./lube.exe tests/cli/gfx_real_window.lube
      - name: Keep the output of failing tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-${{ runner.os }}
          path: build/failed/
          if-no-files-found: ignore
      - name: Package (no DLLs needed)
        run: |
          make clean
          LDFLAGS="-static -s" make
          strip plugins/*.dll
          ./lube.exe -e 'print("lube runs:", 1 + 2)'
          ./lube.exe -e 'import net; print("with its plugins:", net.udp_open())'
          zip -r lube-windows-x86_64.zip lube.exe plugins README.md
      - uses: actions/upload-artifact@v4
        with:
          name: lube-windows-x86_64
          path: lube-windows-x86_64.zip

  android:
    name: Android (the template in mobile/android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build the app (Lube and main.c for each ABI, with the NDK)
        run: gradle -p mobile/android assembleDebug --console=plain
      - name: The native part again, every warning an error
        run: |
          cmake -S mobile/android/app/src/main/cpp -B build/android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DCMAKE_C_FLAGS="-Wall -Wextra -Wno-unused-parameter -Werror"
          cmake --build build/android -j 4

  ios:
    name: iOS (the template in mobile/ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make the Xcode project
        run: cmake -G Xcode -S mobile/ios -B build/ios -DCMAKE_SYSTEM_NAME=iOS
      - name: Build the app for the simulator (no signing; every warning an error)
        run: |
          xcodebuild -project build/ios/LubeApp.xcodeproj -scheme LubeApp -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO GCC_TREAT_WARNINGS_AS_ERRORS=YES build

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Lube ${GITHUB_REF_NAME#v}" --generate-notes \
            lube-linux-x86_64.tar.gz lube-macos-universal.tar.gz lube-windows-x86_64.zip
